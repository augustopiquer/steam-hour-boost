name: Steam Hour Booster - Ejecución Programada

on:
  schedule:
    # Se ejecuta CADA 6 HORAS.
    - cron: '0 */6 * * *' 
  workflow_dispatch:

jobs:
  boost_hours:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: 3. Instalar Dependencias (npm install)
        run: npm install

      - name: 4. Ejecutar el Steam Booster (node index.js)
        # ⚠️ SOLUCIÓN: Pasamos la clave 'GAMES' y la clave 'ACCOUNTS' directamente al comando 'run'
        # Esto obliga al shell a crear las variables de entorno antes de ejecutar el script.
        run: |
          GAMES='730' ACCOUNTS='${{ secrets.STEAM_ACCOUNTS }}' node index.js

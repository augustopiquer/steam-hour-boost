name: Steam Hour Booster - Ejecución Programada

on:
  schedule:
    # Se ejecuta CADA 6 HORAS. Esto es suficiente para el boost.
    - cron: '0 */6 * * *' 
  workflow_dispatch: # Permite ejecución manual

jobs:
  boost_hours:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: 3. Instalar Dependencias (npm install)
        run: npm install

      - name: 4. Ejecutar el Steam Booster (node index.js)
        # ⚠️ SOLUCIÓN FINAL para el error de 'undefined':
        # Pasamos la lista de juegos como una variable de entorno de shell directamente, 
        # junto con la ejecución del script. Esto es más robusto que la sintaxis 'env:'.
        run: |
          GAMES='440,570,1677740,578080,1172470,730,1422450' node index.js
        env:
          # Dejamos ACCOUNTS en el bloque env: ya que generalmente no da problemas.
          ACCOUNTS: ${{ secrets.STEAM_ACCOUNTS }}
